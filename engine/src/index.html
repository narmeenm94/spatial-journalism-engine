<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Spatial Journalism Engine</title>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- 8th Wall (loaded dynamically based on project key) -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    
    #sj-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    .sj-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      z-index: 9999;
    }
    
    .sj-loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .sj-loading-text {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="sj-container">
    <div class="sj-loading" id="sj-loading">
      <div class="sj-loading-spinner"></div>
      <div class="sj-loading-text">Loading experience...</div>
    </div>
  </div>
  
  <script>
    // Engine will be initialized here or via external script
    // Example: SJEngine.init({ storyUrl: './story.json' })
  </script>
</body>
</html>
